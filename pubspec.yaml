name: gujju_learn
description: "Offline multilingual language-learning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  google_fonts: ^6.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/common/
    - assets/images/gujarati/
    - assets/images/hindi/
    - assets/images/english/
    - assets/images/sanskrit/
    - assets/animations/common/
    - assets/animations/gujarati/
    - assets/animations/hindi/
    - assets/animations/english/
    - assets/animations/sanskrit/
